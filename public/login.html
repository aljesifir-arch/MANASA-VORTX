<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخول | منصة حمزة المركزية</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,Tahoma,sans-serif;color:#e8f0ff;
background:radial-gradient(circle at 20% 20%,#1a1050,#05060f 60%)}
.box{width:min(380px,92vw);padding:34px;border-radius:20px;background:rgba(255,255,255,.06);backdrop-filter:blur(16px);border:1px solid rgba(0,229,255,.35);
box-shadow:0 0 40px rgba(0,229,255,.25);text-align:center}
h1{font-size:22px;margin:0 0 6px}p{margin:0 0 22px;opacity:.7;font-size:14px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font-size:16px;margin-bottom:14px}
input:focus{outline:none;border-color:#00e5ff;box-shadow:0 0 14px #00e5ff88}
button{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#00e5ff,#7c4dff);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 0 20px #00e5ff66}
#e{color:#ff6b81;min-height:20px;font-size:14px;margin-top:10px}
</style></head><body>
<div class="box"><h1>🛡️ منصة حمزة المركزية</h1><p>أدخل كلمة المرور للمتابعة</p>
<input id="p" type="password" placeholder="كلمة المرور" autofocus><button id="b">دخول</button><div id="e"></div></div>
<script>
async function go(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});
if(r.ok)location='/';else e.textContent=(await r.json()).error}
b.onclick=go;p.onkeydown=ev=>ev.key==='Enter'&&go();
</script></body></html>
