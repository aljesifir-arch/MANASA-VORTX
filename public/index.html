<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة حمزة المركزية</title>
<style>
:root{--g:#00e5ff;--gi:1;--mut:#9fb0d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Tahoma,"Segoe UI",sans-serif;background:#05060f;color:#e8f0ff;min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
#bg{position:fixed;inset:0;z-index:0}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.glow{box-shadow:0 0 calc(18px*var(--gi)) color-mix(in srgb,var(--g) calc(45%*var(--gi)),transparent)}
.card,.top,input,select,textarea,.btn,.nav button{border:1px solid color-mix(in srgb,var(--g) 38%,transparent)}
/* الشريط العلوي */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(10,12,30,.8);backdrop-filter:blur(14px);flex-wrap:wrap;position:sticky;top:0;z-index:5;border-width:0 0 1px}
.brand{font-weight:700;font-size:16px;flex:1;min-width:150px;white-space:nowrap}
.plats{display:flex;gap:8px;flex:2;min-width:260px}.plats select{flex:1;min-width:0}
.tools{display:flex;gap:8px;align-items:center}
@media(max-width:640px){.plats{order:5;flex-basis:100%}}
.nav{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}.nav::-webkit-scrollbar{display:none}
.nav button{white-space:nowrap;background:rgba(255,255,255,.05);padding:9px 15px;min-height:42px;border-radius:99px;cursor:pointer;font-size:14px;transition:.22s;scroll-snap-align:center}
.nav button.on{background:color-mix(in srgb,var(--g) 26%,transparent);color:#fff;box-shadow:0 0 calc(14px*var(--gi)) var(--g);transform:translateY(-1px)}
main{padding:6px 14px 50px;max-width:1100px;width:100%;margin:0 auto}
#v.in>*{animation:vin .35s cubic-bezier(.2,.8,.2,1) both}#v.in>*:nth-child(2){animation-delay:.05s}#v.in>*:nth-child(3){animation-delay:.1s}#v.in>*:nth-child(4){animation-delay:.15s}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{opacity:.55}}
.card{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.grid .card{margin:0}
.stat b{display:block;font-size:22px;color:var(--g);margin-top:4px}
input,select,textarea{background:rgba(0,0,0,.4);border-radius:10px;padding:10px 12px;font-size:15px;max-width:100%;transition:box-shadow .2s,border-color .2s}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 12px var(--g);border-color:var(--g)}
.btn{background:rgba(255,255,255,.07);border-radius:12px;padding:9px 15px;min-height:42px;cursor:pointer;font-size:14px;transition:transform .12s,background .2s,box-shadow .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--g) 28%,transparent);box-shadow:0 0 calc(12px*var(--gi)) var(--g)}.btn:active{transform:scale(.95)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:10px}
.ib{min-height:40px;width:40px;padding:0;font-size:17px}
.btn.red:hover{background:#ff3b5c55;box-shadow:0 0 12px #ff3b5c}.btn.red{border-color:#ff3b5c88}
.btn.go{background:#00e67626;border-color:#00e676}.btn.go:hover:not(:disabled){background:#00e67670;box-shadow:0 0 14px #00e676}
.btn.stop{background:#ff3b5c26;border-color:#ff3b5c}.btn.stop:hover:not(:disabled){background:#ff3b5c70;box-shadow:0 0 14px #ff3b5c}
.btn.rs{background:#ffc92826;border-color:#ffc928}.btn.rs:hover:not(:disabled){background:#ffc92870;box-shadow:0 0 14px #ffc928}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row:last-child{margin-bottom:0}.sp{flex:1}
.full{width:100%}.mut{color:var(--mut);font-size:13px}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.ctl .btn{min-height:54px;font-size:16px;font-weight:700;border-radius:14px}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:12px;animation:fade .2s}
.modal .card{width:min(720px,100%);background:#0b0e24;margin:0;max-height:94vh;overflow:auto;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
/* مؤشر الشبكة */
.net{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid var(--nc,#3ddc84);color:var(--nc,#3ddc84);font-size:12px;font-weight:700;transition:color .4s,border-color .4s;min-width:62px;justify-content:center;font-variant-numeric:tabular-nums;direction:ltr}
.net svg{transition:color .4s}.svb{font-size:14px;opacity:.5;transition:.3s}.svb.ok{opacity:1;filter:drop-shadow(0 0 4px #3ddc84)}.svb.busy{animation:pulse .7s infinite;opacity:1}
/* أشرطة الحمل */
.bar{height:9px;border-radius:99px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--bc,#3ddc84);transition:width .6s cubic-bezier(.4,0,.2,1),background .4s;box-shadow:0 0 10px var(--bc,#3ddc84)}
.bar.big{height:18px}.bar.hot i{animation:pulse .9s infinite}
.lrow{display:grid;grid-template-columns:78px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin-top:8px}.lrow span:last-child{text-align:left;direction:ltr;color:var(--mut)}
.lvl{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}.lvl b{font-size:18px}
/* الكونسول */
.term{background:#02040b;color:#e6edff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;height:50vh;height:50dvh;min-height:280px;overflow:auto;padding:10px;border-radius:12px;direction:ltr;text-align:left;line-height:1.55;border:1px solid #ffffff14;scroll-behavior:auto}
.ln{padding:0 8px;border-left:3px solid transparent;white-space:pre-wrap;word-break:break-word}.ln .tm{color:#5d6a8c;font-style:normal;margin-right:8px;font-size:11px}
.ln.out{color:#e6edff}.ln.errd{color:#ff9aa8;border-color:#ff9aa855}
.ln.err{color:#ff5470;border-color:#ff5470;background:#ff547014}.ln.trace{color:#b86a78;border-color:#ff547033}
.ln.warn{color:#ffb020;border-color:#ffb020;background:#ffb02012}.ln.ok{color:#3ddc84;border-color:#3ddc84}
.ln.info{color:#5cc8ff;border-color:#5cc8ff}.ln.sys{color:var(--g);border-color:var(--g)}.ln.cmd{color:#ffd24a;border-color:#ffd24a;font-weight:700}
.term[data-f=err] .ln:not(.err):not(.trace){display:none}.term[data-f=warn] .ln:not(.warn){display:none}.term[data-f=ok] .ln:not(.ok){display:none}
.cp{background:#ffffff1c;border:1px solid #ffffff44;color:#fff;border-radius:8px;font-size:11px;padding:1px 8px;margin-left:8px;cursor:pointer;font-family:inherit}.cp:hover{background:var(--g);color:#000}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:5px 12px;border-radius:99px;font-size:13px;background:#ffffff0d;border:1px solid #ffffff22;cursor:pointer;transition:.2s}.chip.on{background:color-mix(in srgb,var(--g) 30%,transparent);border-color:var(--g)}
.det{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dit{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:12px;background:#ffffff0d;border:1px solid #ffffff2a;animation:pop .3s}
.dit code{direction:ltr;font-size:14px;word-break:break-all;flex:1;min-width:100px;color:#fff}
.dit.pair{border-color:#00e676;background:#00e67618;box-shadow:0 0 16px #00e67655}.dit.pair code{font-size:24px;letter-spacing:3px;font-weight:700;color:#3dffa0;text-align:center}
.ebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:#ff547020;border:1px solid #ff5470;margin-bottom:10px;animation:pop .3s}.ebar span{flex:1;min-width:150px;direction:ltr;text-align:left;font-size:13px;color:#ff8a9c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rich{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7}.rich code{background:#0006;padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block}
.code{position:relative;margin:8px 0;background:#02040b;border:1px solid #ffffff22;border-radius:10px;padding:34px 10px 10px;direction:ltr;text-align:left}.code .btn{position:absolute;top:4px;right:4px}.code pre{margin:0;overflow:auto;font-size:13px;white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace}
.chat{height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;scroll-behavior:smooth}
.msg{padding:10px 13px;border-radius:14px;max-width:90%;font-size:14px}.msg.u{background:color-mix(in srgb,var(--g) 25%,transparent);align-self:flex-start;white-space:pre-wrap}.msg.a{background:rgba(255,255,255,.1);align-self:flex-end}
.drop{border:2px dashed var(--g);border-radius:14px;padding:14px;text-align:center;opacity:.75;margin-bottom:10px;font-size:14px;transition:.2s}.drop.over{background:#ffffff18;opacity:1}
#pg{height:6px;background:#fff2;border-radius:4px;overflow:hidden;display:none;margin-bottom:8px}#pg i{display:block;height:100%;width:0;background:var(--g)}
/* قائمة الملفات */
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px;font-size:14px}.crumbs a{color:var(--g);cursor:pointer;padding:4px 8px;border-radius:8px}.crumbs a:hover{background:#ffffff14}.crumbs i{opacity:.4;font-style:normal}
.fl{display:flex;flex-direction:column;gap:2px}
.fr{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;transition:background .15s}.fr:hover{background:#ffffff0d}
.fr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-size:15px}.fr .nm.d{color:var(--g)}
.fr .sz{font-size:12px;color:var(--mut);min-width:58px;text-align:left;direction:ltr}
.selbar{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;margin-bottom:10px;border-radius:12px;background:color-mix(in srgb,var(--g) 18%,transparent);animation:pop .2s}.selbar.on{display:flex}
.menu{position:fixed;z-index:90;min-width:210px;background:#0d1130;border:1px solid color-mix(in srgb,var(--g) 55%,transparent);border-radius:14px;padding:6px;box-shadow:0 10px 40px #000a,0 0 18px color-mix(in srgb,var(--g) 40%,transparent);animation:pop .16s;max-height:80vh;overflow:auto}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;background:none;border:0;border-radius:10px;cursor:pointer;font-size:14px;text-align:right}.menu button:hover{background:#ffffff14}.menu button.red{color:#ff6b81}.menu hr{border:0;border-top:1px solid #ffffff1a;margin:4px 6px}
.menu.sheet{left:0!important;right:0;bottom:0;top:auto!important;border-radius:20px 20px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom));animation:sheet .22s}.menu.sheet button{padding:14px}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}.mbk{position:fixed;inset:0;z-index:89;background:#0006;animation:fade .15s}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;text-align:right}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;margin:0;padding:10px 18px;animation:tin .25s;max-width:92vw}@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}
details summary{cursor:pointer;margin-bottom:8px;color:var(--g)}
.l-err{color:#ff6b81}.think{animation:pulse 1s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="bg"></canvas>
<div class="app">
<header class="top glow">
 <div class="brand">🛡️ منصة حمزة المركزية</div>
 <div class="tools"><span class="svb" id="svb" title="الحفظ التلقائي في المتصفح">💾</span><span class="net" id="net" title="جودة الاتصال"></span>
  <button class="btn ib" id="mute">🔊</button><button class="btn red sm" id="out">خروج</button></div>
 <div class="plats"><select id="plat"></select><button class="btn" id="newp">＋ منصة جديدة</button></div>
</header>
<nav class="nav" id="nav"></nav>
<main id="v"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const L={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let S=L.get('ui',{color:'#00e5ff',intensity:1,speed:1,sound:true}),PID,META,tab='dash',cwd='',timer=null,RT=0,INSTANCE='';
function applyUI(){const r=document.documentElement.style;r.setProperty('--g',S.color);r.setProperty('--gi',S.intensity);$('#mute').textContent=S.sound?'🔊':'🔇';L.set('ui',S)}
let AC;function beep(f=520,d=.07){if(!S.sound)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(1e-4,AC.currentTime+d);o.stop(AC.currentTime+d)}catch{}}
document.addEventListener('click',e=>{if(e.target.closest('button'))beep()});
async function api(u,o={}){if(o.json){o.method=o.method||'POST';o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(o.json)}
 const r=await fetch(u,o);if(r.status===401){location='/login.html';throw 0}const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'خطأ');throw new Error(j.error||'خطأ')}return j}
const P=u=>`/api/platforms/${PID}${u}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const d=document.createElement('div');d.textContent=m;d.className='card glow toast';document.body.append(d);setTimeout(()=>d.remove(),2800)};
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{document.execCommand('copy')}catch{}a.remove()}toast('✔ تم النسخ')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-cv]');if(c){e.preventDefault();copyText(c.dataset.cv);return}const p=e.target.closest('[data-cpre]');if(p){const pre=p.parentElement.querySelector('pre');copyText(pre.textContent)}});
function dlg(html,init){return new Promise(res=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card glow">${html}</div>`;document.body.append(m);const close=v=>{m.remove();res(v)};m.addEventListener('mousedown',e=>{if(e.target===m)close(null)});init(m,close)})}
const ask=(msg,def)=>dlg(`<p>${esc(msg)}</p><input class="full" id="i" value="${esc(def)}"><div class="row" style="margin-top:12px"><button class="btn go" id="ok">موافق</button><button class="btn" id="no">إلغاء</button></div>`,(m,c)=>{const i=m.querySelector('#i');i.focus();i.select();i.onkeydown=e=>e.key==='Enter'&&c(i.value);m.querySelector('#ok').onclick=()=>c(i.value);m.querySelector('#no').onclick=()=>c(null)});
const sure=msg=>dlg(`<p>${esc(msg)}</p><div class="row"><button class="btn red" id="ok">تأكيد</button><button class="btn" id="no">إلغاء</button></div>`,(m,c)=>{m.querySelector('#ok').onclick=()=>c(true);m.querySelector('#no').onclick=()=>c(false)});
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const lc=p=>p>=85?'#ff3b5c':p>=70?'#ff8a1f':p>=50?'#ffd600':'#3ddc84';
const lname=p=>p>=85?'⚠ حرج':p>=70?'مرتفع':p>=50?'متوسط':'خفيف';
// خلفية
(function(){const c=$('#bg'),x=c.getContext('2d');let w,h,pts=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;pts=Array.from({length:Math.min(80,w*h/16000|0)},()=>({x:Math.random()*w,y:Math.random()*h,vx:Math.random()-.5,vy:Math.random()-.5}))};rs();addEventListener('resize',rs);
(function f(){x.clearRect(0,0,w,h);const col=S.color;for(const p of pts){p.x+=p.vx*S.speed;p.y+=p.vy*S.speed;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.fillStyle=col;x.globalAlpha=.6;x.fillRect(p.x,p.y,2,2)}
for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<110){x.strokeStyle=col;x.globalAlpha=.15*(1-d/110);x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[j].x,pts[j].y);x.stroke()}}requestAnimationFrame(f)})()})();

// ===== مؤشر الشبكة: زمن استجابة + سرعة نقل فعلية =====
const NET={sc:100,busy:false,lastSpeed:0};
function netSvg(cell,lv){if(cell)return`<svg viewBox="0 0 24 24" width="17" height="17">${[0,1,2,3].map(i=>`<rect x="${3+i*5}" y="${16-i*4}" width="3" height="${4+i*4}" rx="1" fill="currentColor" opacity="${i<lv?1:.22}"/>`).join('')}</svg>`;
 return`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0" opacity="${lv>=3?1:.2}"/><path d="M5.5 12.4a10 10 0 0 1 13 0" opacity="${lv>=2?1:.2}"/><path d="M9 16a5 5 0 0 1 6 0" opacity="${lv>=1?1:.2}"/><circle cx="12" cy="19.6" r="1.3" fill="currentColor" stroke="none"/></svg>`}
async function netTick(){
 if(NET.busy)return;NET.busy=true;
 const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
 let ms=null,mbps=null;
 if(navigator.onLine!==false){
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),5000),t=performance.now();
  try{await fetch('/api/ping?'+Date.now(),{cache:'no-store',signal:ac.signal});ms=performance.now()-t}catch{}finally{clearTimeout(to)}
  // قياس فعلي كل 15 ثانية لتجنب استهلاك البيانات أو الضغط على الخادم.
  if(ms!=null&&Date.now()-NET.lastSpeed>15000){
   NET.lastSpeed=Date.now();const st=performance.now(),sa=new AbortController(),sto=setTimeout(()=>sa.abort(),8000);
   try{const r=await fetch('/api/speedtest?'+Date.now(),{cache:'no-store',signal:sa.signal});if(r.ok){const b=await r.arrayBuffer(),sec=(performance.now()-st)/1000;if(sec>0)mbps=(b.byteLength*8/1000000)/sec}}catch{}finally{clearTimeout(sto)}
  }
 }
 if(mbps==null&&c&&Number(c.downlink)>0)mbps=Number(c.downlink);
 if(mbps!=null&&Number.isFinite(mbps))NET.mbps=mbps;
 let sc=0;
 if(ms!=null){const latencyScore=Math.max(0,Math.min(100,100-(ms-40)*.22));const speedScore=NET.mbps==null?50:Math.min(100,Math.log10(1+NET.mbps)*38);sc=latencyScore*.55+speedScore*.45;NET.sc=Math.round(NET.sc*.55+sc*.45)}else NET.sc=0;
 const s=NET.sc,col=s>=65?'#3ddc84':s>=45?'#ffd600':s>=25?'#ff8a1f':'#ff3b5c',cell=c&&c.type==='cellular',lv=cell?(s>=80?4:s>=65?3:s>=40?2:s>=15?1:0):(s>=65?3:s>=40?2:s>=15?1:0),n=$('#net');
 n.style.setProperty('--nc',col);n.innerHTML=netSvg(cell,lv)+`<span>${ms==null?'✕':(NET.mbps!=null?NET.mbps.toFixed(NET.mbps>=10?0:1):s)}</span>`;
 n.title=(cell?'بيانات الجوال':'واي فاي')+(ms==null?' — لا يوجد اتصال':` — الاستجابة ${Math.round(ms)} ms`)+(NET.mbps!=null?` — سرعة النقل ${NET.mbps.toFixed(2)} Mbps`:'')+(c&&c.effectiveType?' — '+c.effectiveType:'');
 NET.busy=false;
}
netTick();setInterval(netTick,3000);
// ===== الحفظ التلقائي في المتصفح + الاستعادة إذا ضاعت بيانات السيرفر =====
const IDB={db:null,open(){return this.db||(this.db=new Promise((ok,no)=>{const r=indexedDB.open('hamza-mirror',1);r.onupgradeneeded=()=>r.result.createObjectStore('snap',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))},
 async tx(m,f){const d=await this.open();return new Promise((ok,no)=>{const t=d.transaction('snap',m),s=t.objectStore('snap'),r=f(s);t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)})},
 get(id){return this.tx('readonly',s=>s.get(id))},all(){return this.tx('readonly',s=>s.getAll())},put(o){return this.tx('readwrite',s=>s.put(o))},del(id){return this.tx('readwrite',s=>s.delete(id))}};
let syncing=false,lastSync=0;
const svb=c=>{const e=$('#svb');e.className='svb '+c};
async function syncOne(p){let old=null;try{old=await IDB.get(p.id)}catch{}
 if(old&&old.sig===p.sig&&old.instance===INSTANCE)return;
 const r=await fetch(`/api/platforms/${p.id}/snapshot`);if(!r.ok)return;const blob=await r.blob();
 if(old&&old.instance!==INSTANCE&&old.files>p.files)await IDB.put({...old,id:p.id+'@old',realId:p.id,name:old.name+' (نسخة أقدم)'});
 await IDB.put({id:p.id,name:p.name,sig:r.headers.get('X-Sig'),files:+r.headers.get('X-Files'),instance:INSTANCE,at:Date.now(),blob})}
async function syncAll(){if(syncing||!INSTANCE)return;syncing=true;svb('busy');
 try{const ps=await fetch('/api/platforms').then(r=>r.ok?r.json():[]);for(const p of ps)await syncOne(p);lastSync=Date.now();svb('ok')}catch{svb('')}syncing=false}
const syncSoon=debounce(syncAll,2500);
async function recover(){
 try{const r=await fetch('/api/instance');if(!r.ok)return;INSTANCE=(await r.json()).id}catch{return}
 let recs=[];try{recs=await IDB.all()}catch{return}
 const ps=await fetch('/api/platforms').then(r=>r.ok?r.json():[]);let n=0;
 for(const rec of recs){if(rec.realId||rec.instance===INSTANCE)continue;
  const sp=ps.find(p=>p.id===rec.id);
  if(!sp||sp.files===0){try{const r=await fetch('/api/restore-snapshot/'+rec.id,{method:'POST',headers:{'Content-Type':'application/zip'},body:rec.blob});if(r.ok){n++;rec.instance=INSTANCE;await IDB.put(rec)}}catch{}}}
 if(n)toast(`♻️ تمت استعادة ${n} منصة من نسخة المتصفح`)}

let CS={};
const lvl=l=>{const m=l.m||'';if(l.k==='cmd')return'cmd';
 if(l.k==='sys')return/✖|فشل|خطأ/.test(m)?'err':/⏹|⏱/.test(m)?'warn':/✔/.test(m)?'ok':'sys';
 if(/^\s+at\s|^\s*\^+\s*$|node:internal/.test(m))return'trace';
 if(/\b(error|err!|fatal|exception|unhandled|uncaught|failed|cannot find|enoent|eaddrinuse|econnrefused|etimedout|syntaxerror|typeerror|referenceerror|rejection|denied)\b|خطأ|فشل|✖|❌|🔴/i.test(m))return'err';
 if(/\b(warn|warning|deprecated|deprecation|retry|retrying|timeout|reconnect|reconnecting|disconnected)\b|تحذير|⚠/i.test(m))return'warn';
 if(/\b(success|successfully|connected|ready|listening|started|online|running|done|logged in)\b|✔|✅|🟢|تم |نجح|متصل|جاهز/i.test(m))return'ok';
 if(/\b(info|debug|http|loading|installing)\b|ℹ|📦|▶|🔄|🐙/i.test(m))return'info';
 return l.k==='err'?'errd':'out'};
function detect(m){const o=[],add=(k,l,v)=>o.push({k,l,v});let x;
 if((x=m.match(/(?<![A-Za-z0-9])([A-Z0-9]{4}-[A-Z0-9]{4})(?![A-Za-z0-9])/))&&/[A-Z]/.test(x[1]))add('pair','رمز الربط',x[1]);
 else if((x=m.match(/(?:pairing code|code|كود|رمز|الربط|link)\W{1,25}(\w{8})(?![A-Za-z0-9_])/i))&&/^[A-Z0-9]{8}$/.test(x[1]))add('pair','رمز الربط',x[1]);
 else if(CS.kw>0&&(x=m.trim().match(/^([A-Z0-9]{4}-?[A-Z0-9]{4})$/))&&/[A-Z]/.test(x[1]))add('pair','رمز الربط',x[1]);
 if(!o.length&&/pairing|code|كود|رمز|ربط/i.test(m))CS.kw=3;else if(CS.kw>0)CS.kw--;
 if((x=m.match(/(?:otp|verification|التحقق)\D{0,15}(\d{4,8})\b/i)))add('otp','رمز التحقق',x[1]);
 if((x=m.match(/https?:\/\/[^\s"'<>]+/)))add('url','رابط',x[0].replace(/[.,;:)\]]+$/,''));
 return o}
